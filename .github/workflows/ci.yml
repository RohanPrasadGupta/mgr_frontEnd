name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API client is generated from the committed OpenAPI spec
        run: |
          npm run api:generate
          git diff --exit-code -- lib/api/schema.d.ts || (echo "::error::lib/api/schema.d.ts is stale (run npm run api:generate)" && exit 1)
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (zero warnings allowed)
        run: npm run lint -- --max-warnings=0
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          API_URL: http://localhost:8000
